; Hazer-TX - ESP32-2432S028R ("CYD") touchscreen remote
; The sketch lives in Hazer-TX/ so it still opens unchanged in the Arduino IDE.

[platformio]
src_dir = Hazer-TX

[env:cyd]
; Arduino-ESP32 core 3.x (the code uses the 3.x ESP-NOW callback signature)
platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.05.50/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
